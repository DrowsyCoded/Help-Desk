{% extends "base.html" %}
{% block title %}Submit a Ticket{% endblock %}
{% block content %}
<h1>Submit a Support Ticket</h1>
<form method="post" class="card">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label>Device name
    <input type="text" name="device_name" placeholder="e.g. Mom's laptop, Living room PC" required>
  </label>
  <label>Your name
    <input type="text" name="submitted_by" required>
  </label>
  <label>What's going on?
    <textarea name="issue_description" rows="5" placeholder="Describe the problem" required></textarea>
  </label>
  <label>Category
    <select name="category">
      {% for c in categories %}<option value="{{ c }}">{{ c }}</option>{% endfor %}
    </select>
  </label>
  <label>Priority
    <select name="priority">
      {% for p in priorities %}<option value="{{ p }}" {% if p == 'Medium' %}selected{% endif %}>{{ p }}</option>{% endfor %}
    </select>
  </label>
  <button type="submit">Submit Ticket</button>
</form>
{% endblock %}
