{% extends "base.html" %}
{% block title %}Help Desk{% endblock %}
{% block content %}
<div class="hero">
  <h1>Need help with a device?</h1>
  <p class="hero-sub">Submit a ticket and it'll land straight in the queue.</p>
  <a href="{{ url_for('submit_ticket') }}" class="hero-button">Submit a Ticket</a>
</div>

<div class="login-secondary">
  <p class="login-toggle">Admin? <a href="#admin-login" onclick="document.getElementById('admin-login').classList.toggle('hidden'); return false;">Log in</a></p>
  <div id="admin-login" class="card {% if not error %}hidden{% endif %}">
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label>Username
        <input type="text" name="username" required>
      </label>
      <label>Password
        <input type="password" name="password" required>
      </label>
      <button type="submit">Log in</button>
    </form>
  </div>
</div>
{% endblock %}
